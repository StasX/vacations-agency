name: main

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: ${{ matrix.application }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        application: [Flask, Django]
    defaults:
      run:
        working-directory: ${{ matrix.application }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            ${{ matrix.application }}/requirements.txt
            ${{ matrix.application }}/requirements-dev.txt

      - name: Install MySQL client build dependencies
        if: matrix.application == 'Django'
        run: |
          sudo apt-get update
          sudo apt-get install --yes default-libmysqlclient-dev build-essential pkg-config

      - name: Set up Node.js for Flask JavaScript tests
        if: matrix.application == 'Flask'
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          set -eo pipefail
          mkdir -p reports
          python -m pytest -q --junitxml=reports/pytest.xml 2>&1 | tee reports/pytest.log

      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.application }}-test-results
          path: ${{ matrix.application }}/reports/
          retention-days: 14
          if-no-files-found: warn

  mysql-integration:
    name: Real MySQL integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build isolated application test images
        run: docker compose -p vacations-mysql-tests -f compose.mysql-tests.yml build
      - name: Start disposable MySQL and Redis
        run: docker compose -p vacations-mysql-tests -f compose.mysql-tests.yml up -d --wait --wait-timeout 180 mysql redis
      - name: Test Django against MySQL
        run: docker compose -p vacations-mysql-tests -f compose.mysql-tests.yml run --rm django-tests
      - name: Test Flask against MySQL
        if: ${{ !cancelled() }}
        run: docker compose -p vacations-mysql-tests -f compose.mysql-tests.yml run --rm flask-tests
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test migration history validation
        run: |
          python -m pip install pytest
          python -m pytest -c tests/migrations/pytest.ini tests/migrations -q
      - name: Collect service logs
        if: failure()
        run: docker compose -p vacations-mysql-tests -f compose.mysql-tests.yml logs --no-color mysql redis
      - name: Remove isolated test environment
        if: always()
        run: docker compose -p vacations-mysql-tests -f compose.mysql-tests.yml down --volumes --remove-orphans

  redis-integration:
    name: Real Redis integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build isolated Redis test environment
        run: docker compose -p vacations-redis-tests -f compose.redis-tests.yml build
      - name: Run refresh-token tests against real Redis
        run: docker compose -p vacations-redis-tests -f compose.redis-tests.yml run --rm redis-tests
      - name: Collect Redis logs
        if: failure()
        run: docker compose -p vacations-redis-tests -f compose.redis-tests.yml logs --no-color redis
      - name: Remove isolated Redis test environment
        if: always()
        run: docker compose -p vacations-redis-tests -f compose.redis-tests.yml down --volumes --remove-orphans

  browser:
    name: Browser-to-backend flows
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build isolated browser test environment
        run: docker compose -p vacations-browser-tests -f compose.browser-tests.yml build
      - name: Run customer and statistics browser flows
        run: docker compose -p vacations-browser-tests -f compose.browser-tests.yml run --rm browser-tests
      - name: Collect application logs
        if: failure()
        run: docker compose -p vacations-browser-tests -f compose.browser-tests.yml logs --no-color
      - name: Upload browser results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-results
          path: tests/browser/reports/
          retention-days: 14
          if-no-files-found: warn
      - name: Remove isolated browser environment
        if: always()
        run: docker compose -p vacations-browser-tests -f compose.browser-tests.yml down --volumes --remove-orphans

  frontend:
    name: React checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: React
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: React/package-lock.json

      - name: Install dependencies
        id: dependencies
        run: npm ci

      - name: Run tests
        run: |
          set -eo pipefail
          mkdir -p reports
          npm run test:ci -- --json --outputFile=reports/jest.json 2>&1 | tee reports/jest.log

      - name: Check TypeScript
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          set -eo pipefail
          mkdir -p reports
          npx --no-install tsc --noEmit 2>&1 | tee reports/typescript.log

      - name: Build production frontend
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          set -eo pipefail
          mkdir -p reports
          npm run build 2>&1 | tee reports/build.log

      - name: Upload frontend check results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: React-check-results
          path: React/reports/
          retention-days: 14
          if-no-files-found: warn

  checkov:
    name: Checkov infrastructure security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Checkov
        run: python -m pip install --upgrade checkov

      - name: Scan Dockerfiles and GitHub Actions
        run: |
          set -eo pipefail
          mkdir -p reports/checkov
          checkov --directory . --framework dockerfile github_actions --compact 2>&1 | tee reports/checkov/checkov.log

      - name: Upload Checkov results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Checkov-results
          path: reports/checkov/
          retention-days: 14
          if-no-files-found: warn

  trivy:
    name: Trivy vulnerabilities and secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Prepare Trivy report directory
        run: mkdir -p reports/trivy

      - name: Scan repository
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: latest
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          format: json
          output: reports/trivy/trivy.json
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
          skip-dirs: .git,Flask/env,Django/env,React/node_modules,React/build,React/coverage,reports

      - name: Upload Trivy results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Trivy-results
          path: reports/trivy/
          retention-days: 14
          if-no-files-found: warn

  bandit:
    name: Bandit Python security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Bandit
        run: python -m pip install --upgrade bandit

      - name: Scan Flask and Django application code
        run: |
          set -eo pipefail
          mkdir -p reports/bandit
          bandit --recursive Flask/src Django/src --severity-level medium --confidence-level medium --format json --output reports/bandit/bandit.json 2>&1 | tee reports/bandit/bandit.log

      - name: Upload Bandit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Bandit-results
          path: reports/bandit/
          retention-days: 14
          if-no-files-found: warn
