name: vacations-browser-tests

x-environment: &environment
  APP_ENV: development
  DJANGO_SETTINGS_MODULE: api.settings.development
  DJANGO_DEBUG: "false"
  MYSQL_HOST: mysql
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: vacation_agency
  MYSQL_USER: integration
  MYSQL_PASSWORD: integration-tests-only
  SECRET_KEY: browser-tests-only-signing-key-at-least-32-bytes
  FLASK_JWT_SECRET_KEY: browser-tests-only-flask-jwt-key-at-least-32-bytes
  PASSWORDS_SALT: browser-tests-only
  ISSUER: browser-tests
  AUDIENCE: browser-tests
  JWT_REDIS_URL: redis://redis:6379/0
  JWT_REDIS_PASSWORD: integration-redis-tests-only
  PYTHON_DOTENV_DISABLED: "1"
  FLASK_COOKIE_SECURE: "false"
  DJANGO_COOKIE_SECURE: "false"
  DJANGO_ALLOWED_HOSTS: localhost,vacations-statistics,dashboard
  DJANGO_CSRF_TRUSTED_ORIGINS: http://dashboard:3000

x-image-storage: &image-storage
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: browser-tests
  MINIO_SECRET_KEY: browser-tests-minio-only
  MINIO_SECURE: "false"

services:
  minio:
    build: ./MinIO
    environment:
      MINIO_ROOT_USER: browser-tests
      MINIO_ROOT_PASSWORD: browser-tests-minio-only
  image-initialization:
    build: ./Flask
    entrypoint: [python, -m, utils.minio_images]
    environment: *image-storage
    depends_on:
      minio:
        condition: service_healthy
  mysql:
    container_name: vacations-browser-tests-database
    extends:
      file: compose.mysql-tests.yml
      service: mysql
  redis:
    container_name: vacations-browser-tests-redis
    extends:
      file: compose.mysql-tests.yml
      service: redis
  catalog:
    build: ./Flask
    environment:
      <<: [*environment, *image-storage]
    depends_on:
      image-initialization:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
  vacations-statistics:
    build: ./Django
    environment: *environment
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
  dashboard:
    build: ./React
    depends_on:
      vacations-statistics:
        condition: service_healthy
  browser-tests:
    build: ./tests/browser
    init: true
    shm_size: 1gb
    environment:
      <<: *environment
      BROWSER_TESTS: "1"
    depends_on:
      catalog:
        condition: service_healthy
      dashboard:
        condition: service_healthy
    volumes:
      - ./tests/browser/reports:/reports
