name: vacations-mysql-tests

x-test-environment: &test-environment
  MYSQL_INTEGRATION_TESTS: "1"
  MYSQL_HOST: mysql
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: vacation_agency
  MYSQL_USER: integration
  MYSQL_PASSWORD: integration-tests-only
  SECRET_KEY: mysql-integration-only-signing-key-at-least-32-bytes
  SESSION_SECRET_KEY: mysql-integration-only-session-key
  PASSWORDS_SALT: integration-tests-only
  ISSUER: mysql-integration-tests
  AUDIENCE: mysql-integration-tests
  JWT_REDIS_URL: redis://redis:6379/0
  JWT_REDIS_PASSWORD: integration-redis-tests-only
  DJANGO_ALLOWED_HOSTS: testserver
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHON_DOTENV_DISABLED: "1"

services:
  redis:
    container_name: vacations-mysql-tests-redis
    build: ./Redis
    environment:
      REDIS_PASSWORD: integration-redis-tests-only
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=1m,mode=1777
      - /data:rw,nosuid,nodev,size=16m,uid=999,gid=1000

  mysql:
    container_name: vacations-mysql-tests-database
    build: ./MySQL
    environment:
      MYSQL_DATABASE: vacation_agency
      MYSQL_USER: integration
      MYSQL_PASSWORD: integration-tests-only
      MYSQL_ROOT_PASSWORD: integration-root-tests-only
    tmpfs:
      - /var/lib/mysql:rw,nosuid,nodev,mode=1777
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=tcp --host=127.0.0.1 --user=$$MYSQL_USER --execute='SELECT 1'"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 20s

  django-tests:
    container_name: vacations-mysql-tests-django
    build:
      context: .
      dockerfile: tests/mysql/Dockerfile
      args:
        APPLICATION: Django
    environment:
      <<: *test-environment
      TEST_APPLICATION: Django
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    command: ["tests/mysql/test_django.py"]

  flask-tests:
    container_name: vacations-mysql-tests-flask
    build:
      context: .
      dockerfile: tests/mysql/Dockerfile
      args:
        APPLICATION: Flask
    environment:
      <<: *test-environment
      TEST_APPLICATION: Flask
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    command: ["tests/mysql/test_flask.py", "tests/mysql/test_migrations.py"]
