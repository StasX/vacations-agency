services:

  vacations-redis:
    image: vacations-redis:local
    build: ./Redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=1m,mode=1777
    pids_limit: 64
    mem_limit: 256m
    networks:
      - redis-backend
    volumes:
      - redis-volume:/data
    restart: unless-stopped

  # MySQL service: 
  vacations-database:
    image: sm1986/vacations-database:1.0
    build: ./MySQL
    container_name: vacations-database
    volumes:
      - vacations-volume:/var/lib/mysql
    environment:
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ------------------------------------------------------------------------------------------

  # Django service: 
  vacations-statistics:
    depends_on:
      vacations-redis:
        condition: service_healthy
      vacations-database:
        condition: service_healthy
    image: sm1986/vacations-statistics:1.0
    build: ./Django
    container_name: vacations-statistics
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      JWT_REDIS_URL: redis://vacations-redis:6379/0
      JWT_REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-}
      DJANGO_COOKIE_SECURE: ${DJANGO_COOKIE_SECURE:-true}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      MYSQL_HOST: vacations-database
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD} 
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      SECRET_KEY: ${SECRET_KEY}
      PASSWORDS_SALT: ${PASSWORDS_SALT}
      ISSUER: ${ISSUER}
      AUDIENCE: ${AUDIENCE}
    restart: unless-stopped
    ports:
      - 8000:8000
    networks:
      - default
      - redis-backend
  
  # ------------------------------------------------------------------------------------------

  # Flask service: 
  vacations-catalog:
    depends_on:
      vacations-database:
        condition: service_healthy
    image: sm1986/vacations-catalog:1.0
    build: ./Flask 
    container_name: vacations-catalog
    volumes:
      - vacation-images:/app/static/images/vacations
    environment:
      MYSQL_HOST: vacations-database
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY}
      PASSWORDS_SALT: ${PASSWORDS_SALT}
    restart: unless-stopped
    ports:
      - 5000:5000

  # ------------------------------------------------------------------------------------------

  # React service:
  vacations-statistics-frontend:
    depends_on:
      - vacations-statistics
    image: sm1986/vacations-statistics-frontend:1.0
    build: ./React
    container_name: vacations-statistics-frontend
    restart: unless-stopped
    ports:
      - 3000:3000

# ------------------------------------------------------------------------------------------

# List of all volumes: 
volumes:
  redis-volume:
  vacations-volume:
  vacation-images:

networks:
  redis-backend:
    internal: true
