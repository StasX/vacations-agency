services:

  # MySQL service: 
  vacations-database:
    image: sm1986/vacations-database:1.0
    build: ./MySQL
    container_name: vacations-database
    volumes:
      - vacations-volume:/var/lib/mysql
    environment:
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ------------------------------------------------------------------------------------------

  # Django service: 
  vacations-statistics:
    depends_on:
      vacations-database:
        condition: service_healthy
    image: sm1986/vacations-statistics:1.0
    build: ./Django
    container_name: vacations-statistics
    environment:
      MYSQL_HOST: vacations-database
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD} 
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      SECRET_KEY: ${SECRET_KEY}
      PASSWORDS_SALT: ${PASSWORDS_SALT}
      ISSUER: ${ISSUER}
      AUDIENCE: ${AUDIENCE}
    restart: unless-stopped
    ports:
      - 8000:8000
  
  # ------------------------------------------------------------------------------------------

  # Flask service: 
  vacations-catalog:
    depends_on:
      vacations-database:
        condition: service_healthy
    image: sm1986/vacations-catalog:1.0
    build: ./Flask 
    container_name: vacations-catalog
    volumes:
      - vacation-images:/app/static/images/vacations
    environment:
      MYSQL_HOST: vacations-database
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY}
      PASSWORDS_SALT: ${PASSWORDS_SALT}
    restart: unless-stopped
    ports:
      - 5000:5000

  # ------------------------------------------------------------------------------------------

  # React service:
  vacations-statistics-frontend:
    depends_on:
      - vacations-statistics
    image: sm1986/vacations-statistics-frontend:1.0
    build: ./React
    container_name: vacations-statistics-frontend
    restart: unless-stopped
    ports:
      - 3000:3000

# ------------------------------------------------------------------------------------------

# List of all volumes: 
volumes:
  vacations-volume:
  vacation-images:

